<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>협력기업 방문 일정 수립 | 풀무원</title>
    <meta name="description" content="협력기업 방문 일정을 자동으로 수립하고 최적 경로를 설정합니다.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- API Key Modal -->
    <div id="apiKeyModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon">🔑</div>
            <h2>카카오 지도 API 설정</h2>
            <p>카카오 개발자 센터에서 발급받은 키를 입력해주세요.</p>
            <div class="modal-input-group">
                <input type="text" id="apiKeyInput" placeholder="JavaScript 키 입력 (지도용)" autocomplete="off"
                    style="margin-bottom: 0.8rem;">
                <input type="password" id="apiSecretInput" placeholder="REST API 키 입력 (길찾기용)" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button id="saveApiKeyBtn" class="btn-primary">저장하고 시작</button>
                <button id="skipApiKeyBtn" class="btn-secondary">나중에 입력 (데모 모드)</button>
            </div>
            <p class="modal-hint">💡 <a href="https://developers.kakao.com/" target="_blank">카카오 개발자 센터</a>에서 무료로 발급
                가능합니다.
            </p>
        </div>
    </div>

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">🚗</span>
                <div>
                    <h1>방문 일정 수립</h1>
                    <span class="header-subtitle">협력기업 최적 경로 플래너</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button id="apiKeySettingBtn" class="btn-icon" title="API Key 설정">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M16.36 16.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M16.36 7.64l1.42-1.42">
                    </path>
                </svg>
            </button>
            <span class="brand-badge">풀무원</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
        <!-- Left Panel: Route Input -->
        <aside class="route-panel">
            <div class="panel-header">
                <h2>📍 경로 설정</h2>
                <button id="resetBtn" class="btn-ghost" title="초기화">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 4v6h6M23 20v-6h-6"></path>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                    </svg>
                    초기화
                </button>
            </div>

            <!-- Departure -->
            <div class="route-item departure" data-type="departure">
                <div class="route-marker">
                    <div class="marker-dot departure-dot"></div>
                    <div class="marker-line"></div>
                </div>
                <div class="route-input-group">
                    <div class="label-row">
                        <label>출발지</label>
                        <div class="time-input-wrapper">
                            <span>출발시간:</span>
                            <input type="time" id="departureTime" value="09:00">
                        </div>
                    </div>
                    <div class="search-wrapper">
                        <input type="text" class="location-input" id="departureInput" placeholder="출발 장소를 검색하세요"
                            autocomplete="off">
                        <div class="search-dropdown" id="departureDropdown"></div>
                    </div>
                    <div class="location-info" id="departureInfo"></div>
                </div>
            </div>

            <!-- Waypoints Container -->
            <div id="waypointsContainer"></div>

            <!-- Add Waypoint Button -->
            <div class="add-waypoint-wrapper">
                <button id="addWaypointBtn" class="btn-add-waypoint">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    경유지 추가
                </button>
            </div>

            <!-- Arrival -->
            <div class="route-item arrival" data-type="arrival">
                <div class="route-marker">
                    <div class="marker-line marker-line-top"></div>
                    <div class="marker-dot arrival-dot"></div>
                </div>
                <div class="route-input-group">
                    <label>도착지</label>
                    <div class="search-wrapper">
                        <input type="text" class="location-input" id="arrivalInput" placeholder="도착 장소를 검색하세요"
                            autocomplete="off">
                        <div class="search-dropdown" id="arrivalDropdown"></div>
                    </div>
                    <div class="location-info" id="arrivalInfo"></div>
                </div>
            </div>

            <!-- Calculate Button -->
            <div class="action-buttons">
                <button id="calcRouteBtn" class="btn-calculate" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                    </svg>
                    경로 계산
                </button>
                <button id="optimizeBtn" class="btn-optimize" disabled title="경유지 순서 최적화">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="20" x2="21" y2="3"></line>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                        <line x1="4" y1="4" x2="9" y2="9"></line>
                    </svg>
                    최적화
                </button>
            </div>
        </aside>

        <!-- Middle Panel: Business Itinerary -->
        <aside class="itinerary-panel" id="itineraryPanel">
            <div class="panel-header">
                <h2>📋 비즈니스 일정표</h2>
            </div>
            <div id="itineraryContainer" class="itinerary-container">
                <div class="itinerary-empty">
                    <div class="itinerary-empty-icon">📊</div>
                    <p>경로를 계산하시면<br>상세 일정표가 여기에 표시됩니다.</p>
                </div>
            </div>
        </aside>

        <!-- Map Area -->
        <section class="map-section">
            <div id="mapContainer" class="map-container">
                <div class="map-placeholder" id="mapPlaceholder">
                    <div class="placeholder-content">
                        <div class="placeholder-icon">🗺️</div>
                        <h3>지도 영역</h3>
                        <p>API Key를 설정하면 카카오 지도가 표시됩니다.</p>
                        <p class="placeholder-sub">출발지와 도착지를 입력하고 경로를 계산해보세요.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>

</html>
