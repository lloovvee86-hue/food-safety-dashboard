name: Data Scraper and Email Automation

on:
  schedule:
    # 매일 UTC 23:00 실행 (한국 시간 KST 기준 매일 아침 오전 8시)
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

permissions:
  contents: write

jobs:
  scrape_and_email:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: Brand Data
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas
          playwright install chromium

      - name: Run Scraper
        run: python scraper.py


      - name: Commit and Push CSV changes
        working-directory: .
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Brand Data/food_data.csv" "Brand Data/changes_log.csv" "Brand Data/index.html"
          git commit -m "Auto-update food_data.csv via GitHub Actions" || echo "No changes to commit"
          git push
